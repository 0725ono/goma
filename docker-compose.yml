version: "3.8"

services:
  # 開発用ワークスペース（ここにVS Codeが接続します）
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      # ホスト側のカレントディレクトリをコンテナ内の /workspace に同期
      - .:/workspace:cached
    # コンテナが終了しないように永続化
    command: /bin/sh -c "while sleep 1000; do :; done"
    ports:
      # ホスト側は 18080（別プロジェクトが 8080 を使用するため回避）。コンテナ内は 8080 のまま
      # Expo はホストで実行するため 8081 は公開しない
      - "18080:8080"
    depends_on:
      - db

  # データベース
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: family_schedule
    ports:
      # ホスト側は 15432（別プロジェクトの Postgres が 5432 を使用するため回避）
      - "15432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
