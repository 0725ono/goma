spring.application.name=api

# 8080 は他プロジェクトと衝突しやすいため、本プロジェクトの API は 18080 に統一する
server.port=18080

# PostgreSQL（docker-compose の db サービス。値は環境変数で上書き可能）
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:family_schedule}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}

# スキーマは Flyway が管理するため、JPA は検証のみ（勝手に DDL を実行させない）
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# 開発用: Hibernate が発行する SQL を可視化する（いつ・何が飛んだかを学習/デバッグで確認する）
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
# バインド値（? に入る実際の値）も見たい場合は次を有効化
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
