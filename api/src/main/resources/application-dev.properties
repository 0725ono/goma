# ===== 開発（dev）プロファイル専用設定 =====
# SPRING_PROFILES_ACTIVE=dev のときだけ application.properties に上乗せで読み込まれる。
# 起動は `make run`（Makefile が dev を指定する）。

# CORS: ローカルの Expo web（Metro :8081）からのアクセスを許可
app.cors.allowed-origins=http://localhost:8081

# Hibernate が発行する SQL を可視化する（いつ・何が飛んだかを学習/デバッグで確認する）
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
# バインド値（? に入る実際の値）も見たい場合は次を有効化
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
